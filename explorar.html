<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explorar | MusaConnect</title>
    <meta name="theme-color" content="#08070b">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/seguridad.js"></script>
    <script src="js/campana.js"></script>
    <script src="js/ui.js"></script>
    <link rel="stylesheet" href="css/musa.css">
    <style>
        .filtro-rol.activo { color: #fff; background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.22); }
    </style>
</head>
<body class="min-h-screen">

    <main class="max-w-7xl mx-auto px-4 pt-10 pb-16">
        <header class="text-center max-w-2xl mx-auto mc-in">
            <p class="mc-kicker">🧭 Explorar talentos</p>
            <h1 class="mc-display text-4xl md:text-6xl font-extrabold mt-4 leading-[.95]">Encuentra tu<br><span class="mc-grad-text">próximo sonido</span>.</h1>
            <p class="text-zinc-400 mt-5">Artistas, bandas, productores, estudios y fans de la escena independiente.</p>
        </header>

        <!-- Buscador -->
        <div class="mc-glass p-3 mt-10 max-w-3xl mx-auto flex flex-col sm:flex-row gap-3 mc-in mc-d1">
            <div class="relative flex-1">
                <svg class="w-5 h-5 absolute left-4 top-1/2 -translate-y-1/2 text-zinc-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                <input id="buscador" type="search" autocomplete="off" placeholder="Nombre, @usuario, ciudad o género…" class="mc-input !pl-12 !py-3.5 !rounded-2xl !border-transparent !bg-white/[.04] text-base">
            </div>
            <select id="orden" class="mc-input sm:!w-48 !rounded-2xl !border-transparent !bg-white/[.04]">
                <option value="nuevos">Más nuevos</option>
                <option value="nombre">A → Z</option>
                <option value="completos">Perfiles más completos</option>
            </select>
        </div>

        <div id="filtros-rol" class="flex gap-2 justify-start md:justify-center overflow-x-auto mt-6 pb-1"></div>
        <div id="filtros-genero" class="flex gap-2 justify-start md:justify-center flex-wrap mt-3"></div>

        <p id="conteo" class="text-sm text-zinc-500 mt-8 mb-4"></p>
        <div id="grid-talentos" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5">
            <div class="mc-skel h-64"></div><div class="mc-skel h-64"></div><div class="mc-skel h-64"></div><div class="mc-skel h-64 hidden xl:block"></div>
        </div>
        <div id="vacio" class="hidden text-center py-20">
            <div class="text-5xl mb-4">🔍</div>
            <p class="font-bold text-lg">No encontramos a nadie así… todavía.</p>
            <p class="text-zinc-500 text-sm mt-1">Prueba con otra búsqueda o invita a tu gente a MusaConnect.</p>
        </div>
    </main>

    <script>
        const supabaseUrl = 'https://exekwnxlfhukaojxtlcj.supabase.co';
        const supabaseKey = 'sb_publishable_JtSnzoWtEwAHhmGvcpKe0g_OfciTXzh';
        const client = window.supabase.createClient(supabaseUrl, supabaseKey);
        MusaUI.montar(client, { activo: 'explorar' });

        const ROLES = [
            { id: 'todos', texto: 'Todos', emoji: '✦' },
            { id: 'artista', texto: 'Artistas', emoji: '🎤' },
            { id: 'banda', texto: 'Bandas', emoji: '🎸' },
            { id: 'compositor', texto: 'Productores', emoji: '🎹' },
            { id: 'estudio', texto: 'Estudios', emoji: '🎙️' },
            { id: 'fan', texto: 'Fans', emoji: '🎧' }
        ];
        let perfiles = [];
        let rolActivo = new URLSearchParams(location.search).get('rol') || 'todos';
        if (!ROLES.some(r => r.id === rolActivo)) rolActivo = 'todos';
        let generoActivo = null;

        const tipoDe = p => ['artista', 'banda', 'compositor', 'estudio'].includes(p.tipo) ? p.tipo : 'fan';
        // Qué tan completo está un perfil (para ordenar)
        const completitud = p => [p.avatar_url, p.banner_url, p.bio, p.ciudad, (p.generos || []).length, p.track_destacado].filter(Boolean).length;

        async function cargarPerfiles() {
            const { data, error } = await client.from('perfiles')
                .select('id, username, nombre_display, tipo, bio, avatar_url, banner_url, color_acento, fuente_nombre, forma_avatar, generos, ciudad, verificado, track_destacado, created_at')
                .order('created_at', { ascending: false });
            if (error) {
                document.getElementById('grid-talentos').innerHTML = '<p class="col-span-full text-center text-zinc-500 py-10">No pudimos cargar la comunidad. Intenta recargar.</p>';
                return;
            }
            perfiles = data || [];
            pintarFiltros();
            pintar();
        }

        function pintarFiltros() {
            document.getElementById('filtros-rol').innerHTML = ROLES.map(r => {
                const n = r.id === 'todos' ? perfiles.length : perfiles.filter(p => tipoDe(p) === r.id).length;
                return `<button data-rol="${r.id}" class="filtro-rol ${r.id === rolActivo ? 'activo' : ''} shrink-0 inline-flex items-center gap-2 px-4 py-2 rounded-full border border-white/10 text-sm font-bold text-zinc-400 hover:text-white transition-colors">${r.emoji} ${r.texto} <span class="text-[11px] text-zinc-500 font-mono">${n}</span></button>`;
            }).join('');
            document.querySelectorAll('.filtro-rol').forEach(b => b.addEventListener('click', () => { rolActivo = b.dataset.rol; pintarFiltros(); pintar(); }));

            // Géneros más usados por la comunidad
            const cuenta = {};
            perfiles.forEach(p => (p.generos || []).forEach(g => { cuenta[g] = (cuenta[g] || 0) + 1; }));
            const top = Object.entries(cuenta).sort((a, b) => b[1] - a[1]).slice(0, 12).map(([g]) => g);
            document.getElementById('filtros-genero').innerHTML = top.map((g, i) =>
                `<button data-i="${i}" class="filtro-genero mc-chip ${g === generoActivo ? 'activo' : ''}" style="--acento:#ec4899">#${esc(g)}</button>`).join('');
            document.querySelectorAll('.filtro-genero').forEach(b => b.addEventListener('click', () => {
                const g = top[Number(b.dataset.i)];
                generoActivo = generoActivo === g ? null : g;
                pintarFiltros(); pintar();
            }));
        }

        function pintar() {
            const q = document.getElementById('buscador').value.trim().toLowerCase().replace(/^@/, '');
            const orden = document.getElementById('orden').value;
            let lista = perfiles.filter(p => {
                if (rolActivo !== 'todos' && tipoDe(p) !== rolActivo) return false;
                if (generoActivo && !(p.generos || []).includes(generoActivo)) return false;
                if (!q) return true;
                return [p.nombre_display, p.username, p.ciudad, p.bio, ...(p.generos || [])].join(' ').toLowerCase().includes(q);
            });
            if (orden === 'nombre') lista = [...lista].sort((a, b) => (a.nombre_display || a.username).localeCompare(b.nombre_display || b.username, 'es'));
            if (orden === 'completos') lista = [...lista].sort((a, b) => completitud(b) - completitud(a));

            document.getElementById('grid-talentos').innerHTML = lista.map(MusaUI.tarjetaPerfil).join('');
            document.getElementById('vacio').classList.toggle('hidden', lista.length > 0);
            document.getElementById('conteo').textContent = lista.length === 1 ? '1 perfil' : `${lista.length} perfiles`;
        }

        document.getElementById('buscador').addEventListener('input', pintar);
        document.getElementById('orden').addEventListener('change', pintar);
        cargarPerfiles();
    </script>
</body>
</html>

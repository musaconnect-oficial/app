<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muro | MusaConnect</title>
    <meta name="theme-color" content="#08070b">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/seguridad.js"></script>
    <script src="js/campana.js"></script>
    <script src="js/ui.js"></script>
    <link rel="stylesheet" href="css/musa.css">
    <style>
        .like-anim { animation: pop .45s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.45); } 100% { transform: scale(1); } }
        .post-texto a { color: #f9a8d4; }
        .filtro-muro.activo { color: #fff; background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.2); }
    </style>
</head>
<body class="min-h-screen">

    <div class="max-w-7xl mx-auto px-4 pt-6 pb-16 grid lg:grid-cols-[250px_minmax(0,1fr)] xl:grid-cols-[250px_minmax(0,1fr)_300px] gap-6">

        <!-- ===== Columna izquierda ===== -->
        <aside class="hidden lg:block">
            <div class="sticky top-24 space-y-4">
                <div id="mi-tarjeta" class="mc-glass p-5">
                    <div class="mc-skel h-14 w-14 rounded-full"></div>
                    <div class="mc-skel h-4 w-32 mt-4"></div>
                    <div class="mc-skel h-3 w-20 mt-2"></div>
                </div>
                <nav class="mc-panel p-2 text-sm font-bold">
                    <a href="feed.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl bg-white/5 text-white">🌍 Muro global</a>
                    <a href="radar.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-zinc-400 hover:text-white hover:bg-white/5">📡 Radar de colaboraciones</a>
                    <a href="explorar.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-zinc-400 hover:text-white hover:bg-white/5">🧭 Explorar talentos</a>
                    <a href="chat.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-zinc-400 hover:text-white hover:bg-white/5">💬 Mis chats</a>
                </nav>
            </div>
        </aside>

        <!-- ===== Columna central ===== -->
        <main class="min-w-0">
            <div class="flex items-end justify-between mb-5">
                <div>
                    <p class="mc-kicker">Lo que suena hoy</p>
                    <h1 class="mc-display text-4xl font-extrabold mt-1">Muro <span class="mc-grad-text">global</span></h1>
                </div>
                <span class="mc-eq mb-2"><i></i><i></i><i></i><i></i><i></i></span>
            </div>

            <!-- Crear publicación -->
            <div id="caja-composer" class="mc-glass p-4 sm:p-5 mb-6 focus-within:border-pink-500/40 transition-colors">
                <div class="flex gap-3">
                    <div id="mi-avatar-creador" class="w-11 h-11 rounded-full bg-zinc-800 shrink-0 overflow-hidden grid place-items-center">👤</div>
                    <div class="flex-1 min-w-0">
                        <textarea id="input-post-texto" rows="3" placeholder="¿Qué estás cocinando? Pega un link de Spotify, YouTube o SoundCloud y se convierte en reproductor ✨" class="w-full bg-transparent text-white placeholder-zinc-500 text-[15px] outline-none resize-none leading-relaxed"></textarea>

                        <div id="preview-container" class="hidden mb-3 relative inline-block">
                            <img id="img-preview" src="" alt="Vista previa" class="max-h-48 rounded-2xl border border-white/10 object-cover">
                            <button onclick="quitarImagen()" class="absolute top-2 right-2 bg-black/70 text-white rounded-full w-7 h-7 grid place-items-center text-xs hover:bg-rose-500 transition-colors" aria-label="Quitar imagen">✕</button>
                        </div>

                        <div class="flex items-center justify-between border-t border-white/5 pt-3 gap-3">
                            <label class="cursor-pointer text-zinc-400 hover:text-pink-300 transition-colors flex items-center gap-2 text-sm font-bold">
                                <span class="w-8 h-8 rounded-full bg-white/5 grid place-items-center">📸</span> Foto
                                <input type="file" id="input-post-imagen" accept="image/jpeg, image/png, image/webp" class="hidden" onchange="previsualizarImagen(this)">
                            </label>
                            <button id="btn-publicar" onclick="publicarPost()" class="mc-btn mc-btn-sm !px-6">Publicar</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Filtros -->
            <div class="flex gap-2 mb-5 overflow-x-auto">
                <button class="filtro-muro activo shrink-0 px-4 py-1.5 rounded-full border border-white/10 text-sm font-bold text-zinc-400" data-filtro="todo">Todo</button>
                <button class="filtro-muro shrink-0 px-4 py-1.5 rounded-full border border-white/10 text-sm font-bold text-zinc-400" data-filtro="musica">🎵 Con música</button>
                <button class="filtro-muro shrink-0 px-4 py-1.5 rounded-full border border-white/10 text-sm font-bold text-zinc-400" data-filtro="fotos">📸 Con fotos</button>
                <button class="filtro-muro shrink-0 px-4 py-1.5 rounded-full border border-white/10 text-sm font-bold text-zinc-400" data-filtro="mios">✦ Míos</button>
            </div>

            <div id="contenedor-posts" class="flex flex-col gap-5">
                <div class="mc-skel h-40"></div><div class="mc-skel h-56"></div><div class="mc-skel h-40"></div>
            </div>
        </main>

        <!-- ===== Columna derecha ===== -->
        <aside class="hidden xl:block">
            <div class="sticky top-24 space-y-4">
                <div class="mc-panel p-5">
                    <h3 class="font-extrabold flex items-center gap-2">✨ Nuevos en la escena</h3>
                    <div id="nuevos-miembros" class="mt-4 space-y-3"><div class="mc-skel h-10"></div><div class="mc-skel h-10"></div><div class="mc-skel h-10"></div></div>
                    <a href="explorar.html" class="block text-xs font-bold text-pink-300 hover:text-pink-200 mt-4">Ver a toda la comunidad →</a>
                </div>
                <div class="mc-panel p-5">
                    <h3 class="font-extrabold flex items-center gap-2">📡 En el Radar</h3>
                    <div id="ultimos-anuncios" class="mt-4 space-y-3"><div class="mc-skel h-14"></div></div>
                    <a href="radar.html" class="block text-xs font-bold text-pink-300 hover:text-pink-200 mt-4">Buscar colaboraciones →</a>
                </div>
                <p class="text-[11px] text-zinc-600 px-2">© 2026 MusaConnect · Hecho para la escena independiente</p>
            </div>
        </aside>
    </div>

    <script>
        const supabaseUrl = 'https://exekwnxlfhukaojxtlcj.supabase.co';
        const supabaseKey = 'sb_publishable_JtSnzoWtEwAHhmGvcpKe0g_OfciTXzh';
        const client = window.supabase.createClient(supabaseUrl, supabaseKey);
        MusaUI.montar(client, { activo: 'muro' });

        let miUsuarioId = null;
        let miNombreDeUsuario = "Fan";
        let perfilesCache = {};
        let archivoComprimido = null;
        let filtroMuro = 'todo';
        let postsCargados = [], likesCargados = [], comentariosCargados = [];

        async function initFeed() {
            const { data: { user } } = await client.auth.getUser();
            if (user) {
                miUsuarioId = user.id;
                const { data: perfil } = await client.from('perfiles').select('nombre_display, username, avatar_url, tipo, color_acento, forma_avatar, bio').eq('id', user.id).single();
                if (perfil) {
                    miNombreDeUsuario = perfil.nombre_display || perfil.username;
                    document.getElementById('mi-avatar-creador').outerHTML = MusaUI.avatarHtml(perfil, 'w-11 h-11 text-base', 'rounded-full');
                    pintarMiTarjeta(perfil);
                }
            } else {
                document.getElementById('caja-composer').innerHTML = `
                    <div class="flex flex-col sm:flex-row items-center gap-4 text-center sm:text-left">
                        <div class="w-12 h-12 rounded-2xl grid place-items-center text-2xl shrink-0" style="background:var(--mc-grad)">✦</div>
                        <div class="flex-1"><p class="font-bold">Únete para publicar, dar likes y comentar.</p><p class="text-sm text-zinc-400">Es gratis y toma dos minutos.</p></div>
                        <a href="register.html" class="mc-btn mc-btn-sm">Crear cuenta</a>
                    </div>`;
                document.getElementById('mi-tarjeta').innerHTML = `
                    <p class="mc-display font-extrabold text-xl">Súmate a la escena</p>
                    <p class="text-sm text-zinc-400 mt-2">Crea tu perfil de artista o de fan y empieza a conectar.</p>
                    <a href="register.html" class="mc-btn mc-btn-sm w-full mt-4">Únete gratis</a>
                    <a href="login.html" class="block text-center text-xs font-bold text-zinc-400 hover:text-white mt-3">Ya tengo cuenta</a>`;
                document.querySelector('[data-filtro="mios"]').remove();
            }
            cargarPosts();
        }

        function pintarMiTarjeta(p) {
            const acento = safeColor(p.color_acento, '#8b5cf6');
            const t = MusaUI.TIPOS[p.tipo] || MusaUI.TIPOS.fan;
            document.getElementById('mi-tarjeta').innerHTML = `
                <div class="h-14 -mx-5 -mt-5 mb-[-28px] rounded-t-[20px]" style="background:linear-gradient(135deg, ${acento}, transparent)"></div>
                ${MusaUI.avatarHtml(p, 'w-14 h-14 text-xl relative ring-4 ring-[#14121b]')}
                <p class="font-extrabold mt-3 truncate">${esc(p.nombre_display || p.username)}</p>
                <p class="text-xs text-zinc-500">@${esc(p.username)}</p>
                <span class="mc-tipo mc-tipo-${MusaUI.TIPOS[p.tipo] ? p.tipo : 'fan'} mt-3">${t.emoji} ${t.label}</span>
                <div class="grid grid-cols-2 gap-2 mt-4">
                    <a href="profile.html" class="mc-btn-ghost mc-btn-sm">Mi perfil</a>
                    <a href="editar-perfil.html" class="mc-btn-ghost mc-btn-sm">Editar</a>
                </div>`;
        }

        function previsualizarImagen(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (event) => {
                document.getElementById('img-preview').src = event.target.result;
                document.getElementById('preview-container').classList.remove('hidden');

                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 1080; const MAX_HEIGHT = 1080;
                    let width = img.width; let height = img.height;
                    if (width > height) { if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; } }
                    else { if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; } }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    canvas.toBlob((blob) => {
                        archivoComprimido = new File([blob], file.name.split('.')[0] + ".jpg", { type: 'image/jpeg' });
                    }, 'image/jpeg', 0.7);
                };
            };
        }

        function quitarImagen() {
            document.getElementById('input-post-imagen').value = '';
            document.getElementById('preview-container').classList.add('hidden');
            archivoComprimido = null;
        }

        function procesarTextoConEmbeds(texto) {
            if (!texto) return '';
            // Escapamos < y > (suficiente porque el texto va como contenido, no dentro de atributos);
            // dejamos & intacto para que los links con ?a=1&v=ID sigan detectándose
            let html = texto.replace(/</g, "&lt;").replace(/>/g, "&gt;");
            html = html.replace(/\n/g, '<br>');

            const spotifyRegex = /https:\/\/open\.spotify\.com\/(?:intl-[a-z]{2}\/)?(track|album|playlist)\/([a-zA-Z0-9]+)(?:\S*)?/g;
            html = html.replace(spotifyRegex, (match, tipo, id) => `<div class="w-full mt-3 rounded-2xl overflow-hidden"><iframe src="https://open.spotify.com/embed/${tipo}/${id}" width="100%" height="152" frameborder="0" allowtransparency="true" allow="encrypted-media" loading="lazy"></iframe></div>`);

            const soundcloudRegex = /(https:\/\/soundcloud\.com\/[a-zA-Z0-9_-]+\/[a-zA-Z0-9_-]+)(?:\S*)?/g;
            html = html.replace(soundcloudRegex, (match, url) => `<div class="w-full mt-3 rounded-2xl overflow-hidden"><iframe width="100%" height="166" scrolling="no" frameborder="no" allow="autoplay" loading="lazy" src="https://w.soundcloud.com/player/?url=${encodeURIComponent(url)}&color=%23ec4899&auto_play=false&hide_related=true&show_comments=false&show_user=true&show_reposts=false&show_teaser=false"></iframe></div>`);

            const youtubeRegex = /(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/(?:[^\/\n\s]+\/\S+\/|(?:v|e(?:mbed)?)\/|\S*?[?&]v=)|youtu\.be\/)([a-zA-Z0-9_-]{11})(?:\S*)?/gi;
            html = html.replace(youtubeRegex, '<div class="aspect-video w-full rounded-2xl overflow-hidden mt-3"><iframe width="100%" height="100%" src="https://www.youtube.com/embed/$1" frameborder="0" allowfullscreen loading="lazy"></iframe></div>');

            return html;
        }

        const tieneMusica = texto => /open\.spotify\.com|soundcloud\.com|youtube\.com|youtu\.be/i.test(texto || '');

        window.publicarPost = async function() {
            const btn = document.getElementById('btn-publicar');
            const textoRaw = document.getElementById('input-post-texto').value.trim();
            if (!textoRaw && !archivoComprimido) return MusaUI.toast("Escribe algo o adjunta una foto.", 'error');
            btn.disabled = true; btn.textContent = "Subiendo…";

            let imageUrlSubida = null;
            if (archivoComprimido) {
                const filePath = `${miUsuarioId}-${Date.now()}.jpg`;
                const { error: uploadError } = await client.storage.from('feed_images').upload(filePath, archivoComprimido);
                if (uploadError) {
                    btn.disabled = false; btn.textContent = "Publicar";
                    return MusaUI.toast("No se pudo subir la imagen: " + uploadError.message, 'error');
                }
                const { data: { publicUrl } } = client.storage.from('feed_images').getPublicUrl(filePath);
                imageUrlSubida = publicUrl;
            }

            const { error } = await client.from('posts').insert([{ usuario_id: miUsuarioId, contenido: textoRaw, imagen_url: imageUrlSubida }]);
            btn.disabled = false; btn.textContent = "Publicar";

            if (error) MusaUI.toast("Error: " + error.message, 'error');
            else {
                document.getElementById('input-post-texto').value = '';
                quitarImagen();
                MusaUI.toast('¡Publicado! Ya está en el muro.', 'ok');
                cargarPosts();
            }
        }

        async function cargarPosts() {
            const [{ data: postsData }, { data: perfilesData }, { data: likesDBData }, { data: comentariosDBData }] = await Promise.all([
                client.from('posts').select('*').order('fecha', { ascending: false }).limit(50),
                client.from('perfiles').select('id, nombre_display, username, avatar_url, tipo, color_acento, fuente_nombre, forma_avatar, verificado, created_at'),
                client.from('likes_posts').select('*'),
                client.from('comentarios_posts').select('*').order('fecha', { ascending: true })
            ]);

            postsCargados = postsData || [];
            likesCargados = likesDBData || [];
            comentariosCargados = comentariosDBData || [];
            (perfilesData || []).forEach(p => { perfilesCache[p.id] = p; });
            pintarNuevosMiembros(perfilesData || []);
            pintarPosts();
        }

        function pintarPosts() {
            const cont = document.getElementById('contenedor-posts');
            const posts = postsCargados.filter(p => {
                if (filtroMuro === 'musica') return tieneMusica(p.contenido);
                if (filtroMuro === 'fotos') return !!safeUrl(p.imagen_url);
                if (filtroMuro === 'mios') return p.usuario_id === miUsuarioId;
                return true;
            });

            if (posts.length === 0) {
                cont.innerHTML = `<div class="mc-panel text-center py-14 px-6"><div class="text-4xl mb-3">🎧</div><p class="font-bold">Aquí todavía hay silencio.</p><p class="text-sm text-zinc-500 mt-1">${filtroMuro === 'todo' ? '¡Sé el primero en publicar!' : 'Prueba con otro filtro.'}</p></div>`;
                return;
            }

            cont.innerHTML = posts.map(post => {
                const autor = perfilesCache[post.usuario_id] || { nombre_display: 'Usuario', username: 'desconocido', avatar_url: '', tipo: 'fan' };
                const acento = safeColor(autor.color_acento, '#8b5cf6');
                const tipo = MusaUI.TIPOS[autor.tipo] ? autor.tipo : 'fan';
                const contenidoMagico = procesarTextoConEmbeds(post.contenido);
                const imagenHtml = safeUrl(post.imagen_url) ? `<div class="mt-3 rounded-2xl overflow-hidden border border-white/5"><img src="${safeUrl(post.imagen_url)}" alt="" loading="lazy" class="w-full h-auto max-h-[620px] object-cover"></div>` : '';
                const botonBorrar = (post.usuario_id === miUsuarioId) ? `<button onclick="borrarPost(${Number(post.id)})" class="text-zinc-500 hover:text-rose-400 text-xs w-8 h-8 rounded-full grid place-items-center hover:bg-rose-500/10 transition-colors opacity-0 group-hover:opacity-100" title="Borrar publicación">🗑️</button>` : '';

                const likesDelPost = likesCargados.filter(l => l.post_id === post.id);
                const yoLeDiLike = miUsuarioId ? likesDelPost.some(l => l.usuario_id === miUsuarioId) : false;
                const comentariosDelPost = comentariosCargados.filter(c => c.post_id === post.id);
                const comentariosHtml = comentariosDelPost.map(c => {
                    const p = perfilesCache[c.usuario_id];
                    return `
                    <div class="flex gap-2.5 mb-3">
                        ${MusaUI.avatarHtml(p || { nombre_display: c.autor_nombre }, 'w-7 h-7 text-[11px]', 'rounded-full')}
                        <div class="bg-white/[.04] border border-white/5 rounded-2xl rounded-tl-sm px-3 py-2 min-w-0">
                            <div class="flex items-baseline gap-2"><span class="text-xs font-bold">${esc((p || {}).nombre_display || c.autor_nombre)}</span><span class="text-[10px] text-zinc-600">${esc(MusaUI.tiempoRelativo(c.fecha))}</span></div>
                            <p class="text-sm text-zinc-300 leading-snug break-words">${esc(c.mensaje)}</p>
                        </div>
                    </div>`;
                }).join('');

                return `
                <article class="mc-card group p-4 sm:p-5 mc-reveal" style="--acento:${acento}">
                    <div class="flex justify-between items-start gap-3">
                        <a href="visor.html?id=${encodeURIComponent(post.usuario_id)}" class="flex gap-3 items-center min-w-0">
                            <span class="rounded-full p-[2px]" style="background:linear-gradient(135deg, ${acento}, transparent)">${MusaUI.avatarHtml(autor, 'w-11 h-11 text-base', 'rounded-full')}</span>
                            <div class="min-w-0">
                                <p class="font-bold text-[15px] flex items-center gap-1.5 truncate hover:text-[var(--acento)] transition-colors">${esc(autor.nombre_display)}${autor.verificado ? '<span class="mc-verificado">✓</span>' : ''}</p>
                                <p class="text-zinc-500 text-xs flex items-center gap-2"><span class="truncate">@${esc(autor.username)}</span><span>·</span><span class="shrink-0" title="${esc(new Date(post.fecha).toLocaleString('es-CL'))}">${esc(MusaUI.tiempoRelativo(post.fecha))}</span></p>
                            </div>
                        </a>
                        <div class="flex items-center gap-2 shrink-0"><span class="mc-tipo mc-tipo-${tipo} hidden sm:inline-flex">${MusaUI.TIPOS[tipo].emoji} ${MusaUI.TIPOS[tipo].label}</span>${botonBorrar}</div>
                    </div>

                    <div class="post-texto text-zinc-200 text-[15px] leading-relaxed mt-3 break-words">${contenidoMagico}</div>
                    ${imagenHtml}

                    <div class="flex items-center gap-2 mt-4 pt-3 border-t border-white/5">
                        <button onclick="darLike(${Number(post.id)}, this)" class="flex items-center gap-2 px-3 py-1.5 rounded-full hover:bg-rose-500/10 transition-colors text-sm font-bold ${yoLeDiLike ? 'text-rose-400' : 'text-zinc-400'}">
                            <span class="icon-corazon">${yoLeDiLike ? '❤️' : '🤍'}</span> <span class="contador-likes">${likesDelPost.length}</span>
                        </button>
                        <button onclick="toggleComentarios(${Number(post.id)})" class="flex items-center gap-2 px-3 py-1.5 rounded-full hover:bg-white/5 text-zinc-400 hover:text-white transition-colors text-sm font-bold">
                            💬 <span>${comentariosDelPost.length}</span><span class="hidden sm:inline font-semibold">Responder</span>
                        </button>
                    </div>

                    <div id="caja-comentarios-${Number(post.id)}" class="hidden mt-3 pt-3 border-t border-white/5">
                        <div class="max-h-64 overflow-y-auto pr-1">
                            ${comentariosHtml || '<p class="text-xs text-zinc-500 italic mb-3">Sé el primero en responder.</p>'}
                        </div>
                        <div class="flex gap-2 mt-1">
                            <input type="text" id="input-comentario-${Number(post.id)}" placeholder="Escribe una respuesta…" class="mc-input !rounded-full !py-2 text-sm" onkeydown="if(event.key==='Enter') enviarComentario(${Number(post.id)})">
                            <button onclick="enviarComentario(${Number(post.id)})" class="mc-btn mc-btn-sm">Enviar</button>
                        </div>
                    </div>
                </article>`;
            }).join('');
        }

        function pintarNuevosMiembros(perfiles) {
            const nuevos = [...perfiles].sort((a, b) => new Date(b.created_at) - new Date(a.created_at)).slice(0, 5);
            document.getElementById('nuevos-miembros').innerHTML = nuevos.map(p => {
                const tipo = MusaUI.TIPOS[p.tipo] ? p.tipo : 'fan';
                return `
                <a href="visor.html?id=${encodeURIComponent(p.id)}" class="flex items-center gap-3 group">
                    ${MusaUI.avatarHtml(p, 'w-10 h-10 text-sm')}
                    <div class="min-w-0 flex-1"><p class="text-sm font-bold truncate group-hover:text-pink-300">${esc(p.nombre_display || p.username)}</p><p class="text-[11px] text-zinc-500">${MusaUI.TIPOS[tipo].emoji} ${MusaUI.TIPOS[tipo].label}</p></div>
                </a>`;
            }).join('') || '<p class="text-sm text-zinc-500">Aún no hay miembros.</p>';
        }

        async function cargarAnunciosRadar() {
            const { data } = await client.from('radar_anuncios').select('id, titulo, tipo_busqueda, genero, fecha').eq('activa', true).order('fecha', { ascending: false }).limit(3);
            document.getElementById('ultimos-anuncios').innerHTML = (data || []).map(a => `
                <a href="radar.html" class="block p-3 rounded-xl bg-white/[.03] border border-white/5 hover:border-pink-500/40 transition-colors">
                    <p class="text-[10px] font-black uppercase tracking-widest text-pink-300">Busca: ${esc(a.tipo_busqueda)}</p>
                    <p class="text-sm font-bold mt-1 line-clamp-2">${esc(a.titulo)}</p>
                    <p class="text-[11px] text-zinc-500 mt-1">🎵 ${esc(a.genero)} · ${esc(MusaUI.tiempoRelativo(a.fecha))}</p>
                </a>`).join('') || '<p class="text-sm text-zinc-500">No hay anuncios activos. ¡Publica el primero!</p>';
        }

        window.darLike = async function(postId, btnElement) {
            if (!miUsuarioId) return MusaUI.toast("Inicia sesión para dar me gusta.", 'info');
            const iconSpan = btnElement.querySelector('.icon-corazon');
            const countSpan = btnElement.querySelector('.contador-likes');
            let likesActuales = parseInt(countSpan.innerText);

            const { data: existente } = await client.from('likes_posts').select('id').eq('post_id', postId).eq('usuario_id', miUsuarioId).maybeSingle();

            if (existente) {
                await client.from('likes_posts').delete().eq('id', existente.id);
                iconSpan.innerText = '🤍'; countSpan.innerText = likesActuales - 1;
                btnElement.classList.remove('text-rose-400'); btnElement.classList.add('text-zinc-400');
                likesCargados = likesCargados.filter(l => l.id !== existente.id);
            } else {
                const { data: nuevo } = await client.from('likes_posts').insert([{ post_id: postId, usuario_id: miUsuarioId }]).select().maybeSingle();
                iconSpan.innerText = '❤️'; countSpan.innerText = likesActuales + 1;
                btnElement.classList.remove('text-zinc-400'); btnElement.classList.add('text-rose-400');
                iconSpan.classList.remove('like-anim'); void iconSpan.offsetWidth; iconSpan.classList.add('like-anim');
                if (nuevo) likesCargados.push(nuevo);
            }
        }

        window.toggleComentarios = function(postId) {
            const caja = document.getElementById(`caja-comentarios-${postId}`);
            caja.classList.toggle('hidden');
            if (!caja.classList.contains('hidden')) document.getElementById(`input-comentario-${postId}`).focus();
        }

        window.enviarComentario = async function(postId) {
            if (!miUsuarioId) return MusaUI.toast("Inicia sesión para comentar.", 'info');
            const input = document.getElementById(`input-comentario-${postId}`);
            const mensaje = input.value.trim();
            if (!mensaje) return;

            const { error } = await client.from('comentarios_posts').insert([{ post_id: postId, usuario_id: miUsuarioId, autor_nombre: miNombreDeUsuario, mensaje: mensaje }]);
            if (error) return MusaUI.toast("No se pudo comentar: " + error.message, 'error');
            input.value = '';
            await cargarPosts();
            document.getElementById(`caja-comentarios-${postId}`)?.classList.remove('hidden');
        }

        window.borrarPost = async function(id) {
            if (confirm("¿Borrar esta publicación? Se eliminarán también los likes y comentarios.")) {
                const { error } = await client.from('posts').delete().eq('id', id);
                if (error) return MusaUI.toast("No se pudo borrar: " + error.message, 'error');
                MusaUI.toast('Publicación borrada.', 'ok');
                cargarPosts();
            }
        }

        document.querySelectorAll('.filtro-muro').forEach(b => b.addEventListener('click', () => {
            filtroMuro = b.dataset.filtro;
            document.querySelectorAll('.filtro-muro').forEach(x => x.classList.toggle('activo', x === b));
            pintarPosts();
        }));

        initFeed();
        cargarAnunciosRadar();
    </script>
</body>
</html>

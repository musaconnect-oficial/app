<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva contraseña | MusaConnect</title>
    <meta name="theme-color" content="#08070b">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/seguridad.js"></script>
    <script src="js/ui.js"></script>
    <link rel="stylesheet" href="css/musa.css">
</head>
<body class="min-h-screen flex items-center justify-center p-5">

    <div class="w-full max-w-md mc-in">
        <a href="index.html" class="flex justify-center mc-logo text-2xl mb-8"><img src="img/logo.png" alt=""><b class="font-black">MUSA<span>CONNECT</span></b></a>

        <div class="mc-glass p-7 sm:p-9 shadow-2xl" id="panel-formulario">
            <div class="w-14 h-14 rounded-2xl grid place-items-center text-2xl mb-6" style="background:var(--mc-grad-soft); border:1px solid rgba(255,255,255,.1)">🔑</div>
            <h1 class="mc-display text-3xl font-extrabold">Nueva contraseña</h1>
            <p class="text-zinc-400 text-sm mt-1.5">Elige una que no uses en otros sitios.</p>

            <form class="flex flex-col gap-5 mt-8" onsubmit="event.preventDefault(); guardarNuevaClave();">
                <div>
                    <label class="mc-label" for="nueva-clave">Nueva contraseña</label>
                    <input type="password" id="nueva-clave" class="input-field" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
                </div>
                <div>
                    <label class="mc-label" for="confirmar-clave">Confirmar contraseña</label>
                    <input type="password" id="confirmar-clave" class="input-field" placeholder="Repite la contraseña" autocomplete="new-password">
                </div>

                <div id="mensaje-box" class="hidden text-sm rounded-xl px-4 py-3 text-center"></div>

                <button id="btn-guardar" type="submit" class="mc-btn w-full py-4 mt-1">Guardar contraseña</button>
            </form>
        </div>

        <div id="panel-exito" class="hidden mc-glass p-9 text-center">
            <div class="w-20 h-20 rounded-3xl mx-auto grid place-items-center text-4xl" style="background:var(--mc-grad)">✓</div>
            <h2 class="mc-display text-3xl font-extrabold mt-6">¡Listo!</h2>
            <p class="text-zinc-400 text-sm mt-3">Tu contraseña nueva quedó guardada. Ya puedes ingresar con ella.</p>
            <a href="login.html" class="mc-btn w-full py-4 mt-8">Ir a iniciar sesión</a>
        </div>

        <a href="login.html" class="block text-center text-zinc-500 hover:text-zinc-300 text-xs font-bold mt-6">← Volver al login</a>
    </div>

    <script>
        const supabaseUrl = 'https://exekwnxlfhukaojxtlcj.supabase.co';
        const supabaseKey = 'sb_publishable_JtSnzoWtEwAHhmGvcpKe0g_OfciTXzh';
        const client = window.supabase.createClient(supabaseUrl, supabaseKey);
        MusaUI.montar(client, { sinNav: true });

        // Validar que la página se haya abierto desde un link de recuperación válido
        window.onload = function() {
            const hash = window.location.hash;
            if (!hash || !hash.includes('access_token')) {
                mostrarMensaje('Este link no es válido o ya expiró. Pide uno nuevo desde "¿La olvidaste?" en el login.', 'error');
                document.getElementById('btn-guardar').disabled = true;
            }
        };

        async function guardarNuevaClave() {
            const clave1 = document.getElementById('nueva-clave').value;
            const clave2 = document.getElementById('confirmar-clave').value;
            const btn = document.getElementById('btn-guardar');

            if (!clave1 || !clave2) return mostrarMensaje('Completa ambos campos.', 'error');
            if (clave1.length < 6) return mostrarMensaje('La contraseña debe tener mínimo 6 caracteres.', 'error');
            if (clave1 !== clave2) return mostrarMensaje('Las contraseñas no coinciden.', 'error');

            btn.disabled = true;
            btn.textContent = 'Guardando…';

            // Supabase detecta la sesión del link y actualiza la contraseña
            const { error } = await client.auth.updateUser({ password: clave1 });

            if (error) {
                mostrarMensaje(error.message, 'error');
                btn.disabled = false;
                btn.textContent = 'Guardar contraseña';
            } else {
                document.getElementById('panel-formulario').classList.add('hidden');
                document.getElementById('panel-exito').classList.remove('hidden');
                // Cerramos la sesión temporal de recuperación por seguridad
                await client.auth.signOut();
            }
        }

        function mostrarMensaje(texto, tipo) {
            const box = document.getElementById('mensaje-box');
            box.textContent = texto;
            box.className = 'text-sm rounded-xl px-4 py-3 text-center border ' + (tipo === 'error'
                ? 'bg-rose-500/10 border-rose-500/30 text-rose-300'
                : 'bg-emerald-500/10 border-emerald-500/30 text-emerald-300');
        }
    </script>
</body>
</html>

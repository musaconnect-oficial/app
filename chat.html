<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chats | MusaConnect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/seguridad.js"></script>
    <script src="js/campana.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0a0a0a; }
        .fade-in { animation: fadeIn 0.25s ease forwards; }
        @keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }
        .conv-item.activa { background: rgba(236,72,153,0.08); border-left-color: #ec4899; }
    </style>
</head>
<body class="text-white h-screen flex flex-col overflow-hidden">

    <!-- HEADER -->
    <header class="border-b border-zinc-800/80 bg-[#0a0a0a]/90 backdrop-blur shrink-0">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="radar.html" class="flex items-center gap-2 text-white hover:text-pink-400 transition-colors font-bold text-sm">← Radar</a>
            <h1 class="font-black tracking-widest uppercase text-sm">Chats <span class="text-pink-500">Match</span></h1>
            <div class="flex items-center gap-2">
                <a href="notificaciones.html" id="campana" title="Notificaciones" class="hidden relative bg-zinc-800 hover:bg-zinc-700 text-sm px-3 py-1.5 rounded-lg transition-colors border border-zinc-700">🔔<span id="campana-badge" class="hidden absolute -top-1.5 -right-1.5 bg-pink-600 text-white text-[10px] font-black min-w-[18px] h-[18px] px-1 rounded-full items-center justify-center flex"></span></a>
                <a href="profile.html" class="bg-zinc-800 hover:bg-zinc-700 text-white text-xs font-bold px-4 py-2 rounded-lg transition-colors border border-zinc-700">Mi Perfil</a>
            </div>
        </div>
    </header>

    <main class="flex-1 min-h-0 w-full max-w-6xl mx-auto md:px-4 md:py-4">
        <div class="h-full md:grid md:grid-cols-[300px_1fr] md:border md:border-zinc-800 md:rounded-2xl overflow-hidden bg-[#111]">

            <!-- LISTA DE CONVERSACIONES -->
            <aside id="panel-lista" class="h-full flex flex-col border-r border-zinc-800 min-h-0">
                <div class="px-4 py-3 border-b border-zinc-800">
                    <p class="text-[10px] font-black text-zinc-500 uppercase tracking-widest">Tus matches</p>
                </div>
                <div id="lista-conversaciones" class="flex-1 overflow-y-auto">
                    <p class="text-zinc-600 text-sm text-center py-10 animate-pulse">Cargando...</p>
                </div>
            </aside>

            <!-- CONVERSACIÓN ABIERTA -->
            <section id="panel-chat" class="hidden md:flex h-full flex-col min-h-0">
                <div id="chat-vacio" class="flex-1 flex flex-col items-center justify-center text-center p-8">
                    <span class="text-5xl mb-4">💬</span>
                    <p class="text-zinc-400 text-sm font-bold">Elige un chat</p>
                    <p class="text-zinc-600 text-xs mt-1 max-w-xs">Los chats se abren cuando el dueño de un anuncio del Radar acepta a un interesado.</p>
                </div>

                <div id="chat-abierto" class="hidden flex-1 flex-col min-h-0">
                    <div class="px-4 py-3 border-b border-zinc-800 flex items-center gap-3 shrink-0">
                        <button onclick="volverALista()" class="md:hidden text-zinc-400 hover:text-white text-lg pr-1">←</button>
                        <a id="chat-perfil-link" href="#" class="flex items-center gap-3 min-w-0 group">
                            <div id="chat-avatar" class="w-9 h-9 rounded-full bg-zinc-800 overflow-hidden shrink-0"></div>
                            <div class="min-w-0">
                                <p id="chat-nombre" class="font-bold text-sm text-white group-hover:text-pink-400 truncate"></p>
                                <p id="chat-titulo" class="text-[11px] text-zinc-500 truncate"></p>
                            </div>
                        </a>
                    </div>

                    <div id="lista-mensajes" class="flex-1 overflow-y-auto px-4 py-4 space-y-2"></div>

                    <form onsubmit="enviarMensaje(event)" class="p-3 border-t border-zinc-800 flex gap-2 shrink-0">
                        <input id="input-mensaje" type="text" maxlength="1000" autocomplete="off" placeholder="Escribe un mensaje..." class="flex-1 bg-[#1c1c1c] border border-zinc-800 rounded-full px-4 py-2.5 text-sm text-white outline-none focus:border-pink-500 transition-colors">
                        <button id="btn-enviar" type="submit" class="bg-pink-600 hover:bg-pink-500 text-white font-bold px-5 rounded-full text-sm transition-colors shadow-[0_0_10px_rgba(236,72,153,0.3)]">Enviar</button>
                    </form>
                </div>
            </section>
        </div>
    </main>

    <script>
        const supabaseUrl = 'https://exekwnxlfhukaojxtlcj.supabase.co';
        const supabaseKey = 'sb_publishable_JtSnzoWtEwAHhmGvcpKe0g_OfciTXzh';
        const client = window.supabase.createClient(supabaseUrl, supabaseKey);
        actualizarCampana(client);

        let miId = null;
        let conversaciones = [];   // [{ match, otro, ultimo, noLeidos }]
        let perfiles = {};
        let chatActual = null;     // id del match abierto
        let mensajesMostrados = new Set();

        async function init() {
            const { data: { session } } = await client.auth.getSession();
            if (!session) { window.location.href = 'login.html'; return; }
            miId = session.user.id;

            await cargarConversaciones();
            escucharMensajes();

            // chat.html?m=<match> (desde una notificación) o chat.html?u=<usuario> (desde el Radar)
            const params = new URLSearchParams(window.location.search);
            const porMatch = Number(params.get('m'));
            const porUsuario = params.get('u');
            const conv = conversaciones.find(c => c.match.id === porMatch || (porUsuario && c.otro === porUsuario));
            if (conv) abrirChat(conv.match.id);
            else if (porMatch || porUsuario) alert("Ese chat no existe o todavía no tienen un match.");
        }

        async function cargarConversaciones() {
            const { data: matches, error } = await client.from('matches').select('*');
            if (error) return alert("Error cargando chats: " + error.message);

            const otros = [...new Set((matches || []).map(m => m.usuario_a === miId ? m.usuario_b : m.usuario_a))];
            if (otros.length) {
                const { data: ps } = await client.from('perfiles').select('id, nombre_display, username, avatar_url').in('id', otros);
                (ps || []).forEach(p => { perfiles[p.id] = p; });
            }

            let mensajes = [];
            if (matches && matches.length) {
                const { data } = await client.from('mensajes')
                    .select('id, match_id, autor_id, texto, leido, created_at')
                    .in('match_id', matches.map(m => m.id))
                    .order('created_at', { ascending: false })
                    .limit(1000);
                mensajes = data || [];
            }

            conversaciones = (matches || []).map(m => {
                const delMatch = mensajes.filter(x => x.match_id === m.id);
                return {
                    match: m,
                    otro: m.usuario_a === miId ? m.usuario_b : m.usuario_a,
                    ultimo: delMatch[0] || null,
                    noLeidos: delMatch.filter(x => x.autor_id !== miId && !x.leido).length
                };
            });
            renderConversaciones();
        }

        function renderConversaciones() {
            const cont = document.getElementById('lista-conversaciones');
            if (conversaciones.length === 0) {
                cont.innerHTML = `
                    <div class="text-center px-6 py-12">
                        <p class="text-zinc-500 text-sm">Aún no tienes matches.</p>
                        <a href="radar.html" class="inline-block mt-3 text-pink-400 hover:text-pink-300 text-xs font-bold">📡 Ir al Radar →</a>
                    </div>`;
                return;
            }
            const fechaDe = c => new Date(c.ultimo ? c.ultimo.created_at : c.match.created_at);
            conversaciones.sort((a, b) => fechaDe(b) - fechaDe(a));

            cont.innerHTML = conversaciones.map(c => {
                const p = perfiles[c.otro] || { nombre_display: 'Usuario', username: 'desconocido', avatar_url: '' };
                const vistaPrevia = c.ultimo ? (c.ultimo.autor_id === miId ? 'Tú: ' : '') + c.ultimo.texto : 'Nuevo match · ¡Salúdense!';
                return `
                    <button onclick="abrirChat(${Number(c.match.id)})" class="conv-item ${c.match.id === chatActual ? 'activa' : ''} w-full text-left px-4 py-3 flex items-center gap-3 border-l-2 border-transparent hover:bg-zinc-900/60 transition-colors">
                        <div class="w-11 h-11 rounded-full bg-zinc-800 overflow-hidden shrink-0">
                            ${safeUrl(p.avatar_url) ? `<img src="${safeUrl(p.avatar_url)}" class="w-full h-full object-cover">` : `<span class="flex items-center justify-center w-full h-full">👤</span>`}
                        </div>
                        <div class="flex-1 min-w-0">
                            <p class="font-bold text-sm text-white truncate">${esc(p.nombre_display)}</p>
                            <p class="text-xs truncate ${c.noLeidos ? 'text-white font-bold' : 'text-zinc-500'}">${esc(vistaPrevia)}</p>
                        </div>
                        ${c.noLeidos ? `<span class="bg-pink-600 text-white text-[10px] font-black min-w-[20px] h-5 px-1.5 rounded-full flex items-center justify-center">${Number(c.noLeidos)}</span>` : ''}
                    </button>`;
            }).join('');
        }

        window.abrirChat = async function(matchId) {
            const conv = conversaciones.find(c => c.match.id === matchId);
            if (!conv) return;
            chatActual = matchId;
            mensajesMostrados = new Set();

            const p = perfiles[conv.otro] || { nombre_display: 'Usuario', username: 'desconocido', avatar_url: '' };
            document.getElementById('chat-nombre').textContent = p.nombre_display;
            document.getElementById('chat-titulo').textContent = conv.match.titulo ? 'Match por: ' + conv.match.titulo : '@' + p.username;
            document.getElementById('chat-perfil-link').href = 'visor.html?id=' + encodeURIComponent(conv.otro);
            document.getElementById('chat-avatar').innerHTML = safeUrl(p.avatar_url)
                ? `<img src="${safeUrl(p.avatar_url)}" class="w-full h-full object-cover">`
                : `<span class="flex items-center justify-center w-full h-full text-sm">👤</span>`;

            document.getElementById('chat-vacio').classList.add('hidden');
            document.getElementById('chat-abierto').classList.remove('hidden');
            document.getElementById('chat-abierto').classList.add('flex');
            // En celular se muestra una sola columna: la conversación tapa la lista
            document.getElementById('panel-lista').classList.add('hidden', 'md:flex');
            document.getElementById('panel-chat').classList.remove('hidden');
            document.getElementById('panel-chat').classList.add('flex');

            const lista = document.getElementById('lista-mensajes');
            lista.innerHTML = '<p class="text-zinc-600 text-xs text-center py-6">Cargando mensajes...</p>';
            const { data, error } = await client.from('mensajes')
                .select('id, match_id, autor_id, texto, created_at')
                .eq('match_id', matchId)
                .order('created_at', { ascending: true })
                .limit(500);
            if (chatActual !== matchId) return; // el usuario ya abrió otro chat
            if (error) { lista.innerHTML = ''; return alert("Error: " + error.message); }

            lista.innerHTML = data && data.length ? '' : '<p id="sin-mensajes" class="text-zinc-600 text-xs text-center py-6">Es un match 🎉 ¡Manda el primer mensaje!</p>';
            (data || []).forEach(agregarMensaje);
            renderConversaciones();
            marcarLeidos(matchId);
            document.getElementById('input-mensaje').focus();
        }

        window.volverALista = function() {
            chatActual = null;
            document.getElementById('panel-chat').classList.add('hidden');
            document.getElementById('panel-chat').classList.remove('flex');
            document.getElementById('panel-lista').classList.remove('hidden');
            renderConversaciones();
        }

        function agregarMensaje(m) {
            if (mensajesMostrados.has(m.id)) return;
            mensajesMostrados.add(m.id);
            const vacio = document.getElementById('sin-mensajes');
            if (vacio) vacio.remove();

            const mio = m.autor_id === miId;
            const hora = new Date(m.created_at).toLocaleString('es-CL', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
            const lista = document.getElementById('lista-mensajes');
            lista.insertAdjacentHTML('beforeend', `
                <div class="flex ${mio ? 'justify-end' : 'justify-start'} fade-in">
                    <div class="max-w-[80%] px-3.5 py-2 rounded-2xl ${mio ? 'bg-pink-600 text-white rounded-br-sm' : 'bg-[#1f1f1f] text-zinc-200 border border-zinc-800 rounded-bl-sm'}">
                        <p class="text-sm whitespace-pre-wrap break-words">${esc(m.texto)}</p>
                        <p class="text-[9px] mt-1 ${mio ? 'text-pink-200' : 'text-zinc-500'} text-right">${esc(hora)}</p>
                    </div>
                </div>`);
            lista.scrollTop = lista.scrollHeight;
        }

        async function marcarLeidos(matchId) {
            const conv = conversaciones.find(c => c.match.id === matchId);
            if (!conv || conv.noLeidos === 0) return;
            await client.from('mensajes').update({ leido: true })
                .eq('match_id', matchId).neq('autor_id', miId).eq('leido', false);
            conv.noLeidos = 0;
            renderConversaciones();
            actualizarCampana(client);
        }

        window.enviarMensaje = async function(e) {
            e.preventDefault();
            const input = document.getElementById('input-mensaje');
            const texto = input.value.trim();
            if (!texto || !chatActual) return;

            const btn = document.getElementById('btn-enviar');
            btn.disabled = true;
            const { data, error } = await client.from('mensajes')
                .insert([{ match_id: chatActual, autor_id: miId, texto }])
                .select('id, match_id, autor_id, texto, created_at')
                .single();
            btn.disabled = false;
            if (error) return alert("No se pudo enviar: " + error.message);

            input.value = '';
            input.focus();
            agregarMensaje(data);
            const conv = conversaciones.find(c => c.match.id === data.match_id);
            if (conv) { conv.ultimo = data; renderConversaciones(); }
        }

        // Mensajes nuevos en vivo: Supabase solo nos manda los de nuestros propios chats
        function escucharMensajes() {
            client.channel('mensajes-chat')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'mensajes' }, async ({ new: m }) => {
                    let conv = conversaciones.find(c => c.match.id === m.match_id);
                    if (!conv) { await cargarConversaciones(); conv = conversaciones.find(c => c.match.id === m.match_id); }
                    if (!conv) return;
                    conv.ultimo = m;
                    if (m.match_id === chatActual) {
                        agregarMensaje(m);
                        if (m.autor_id !== miId) {
                            await client.from('mensajes').update({ leido: true }).eq('id', m.id);
                        }
                    } else if (m.autor_id !== miId) {
                        conv.noLeidos++;
                        actualizarCampana(client);
                    }
                    renderConversaciones();
                })
                .subscribe();
        }

        init();
    </script>
</body>
</html>
